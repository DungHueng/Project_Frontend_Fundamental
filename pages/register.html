<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../css/register.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
  <div class="container">
    <h1 class="title">Đăng ký tài khoản</h1>
    <p class="content">Đăng ký tài khoản để sử dụng dịch vụ</p>
    <form>
      <table class="form-group">
        <tr>
          <td>
            <label for="first_Name">Họ và tên đệm</label><br>
            <input type="text" name="Name" id="first_Name" class="first_Name_box">
          </td>
          <td>
            <label for="name">Tên</label><br>
            <input type="text" name="name" id="name" class="name_box">
          </td>
        </tr>
      </table>

      <div class="form-group">
        <label for="email">Email</label><br>
        <input type="email" class="email-type" id="text" placeholder="   you@company.com">
        <p id="p" class="p"></p>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label><br>
        <input type="password" class="pass-type">
      </div>

      <div class="form-check">
        <div class="checkbox-group">
          <input type="checkbox" id="accept" style="margin-left: 425px;">
          <label for="accept">Bạn đồng ý với <a href="#" class="link">chính sách và điều khoản</a></label>
        </div>
        <div id="checkbox-error" class="error-message"></div>
      </div>

      <button class="sign_in" id="btn-register">Đăng ký</button>
      <p class="login-link">Bạn đã có tài khoản? <a href="login.html" class="link">Đăng nhập</a></p>
    </form>
  </div>
</body>
<script src="../js/register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
